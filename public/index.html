<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playverse</title>
  <meta name="description" content="Tiny browser games and levels. Race them, beat the leaderboard.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./">Play<span>verse</span></a>
    <div class="title"></div>
  </header>
  <div class="wrap">
    <h1>Levels</h1>
    <ul class="levels" id="levels"><li>Loading…</li></ul>
  </div>
  <script type="module">
    import { loadPublished, loadLevel } from './js/levels.js';
    import { getBest } from './js/store.js';
    const ul = document.getElementById('levels');
    try {
      const pub = await loadPublished();
      const items = await Promise.all(Object.entries(pub).map(async ([id, v]) => {
        try { const { level, info } = await loadLevel(id, v); return { level, info }; } catch { return null; }
      }));
      ul.replaceChildren(...items.filter(Boolean).filter((x) => x.level.type !== 'hub').map(({ level, info }) => {
        const li = document.createElement('li'), a = document.createElement('a');
        a.href = `play.html#/w/${level.id}@${level.version}`;
        const t = document.createElement('div'); t.textContent = level.title; t.style.fontWeight = '700';
        const best = getBest(level.id, level.version);
        const m = document.createElement('div'); m.className = 'meta';
        m.textContent = `by ${level.author} · v${level.version} · ${info.stars} ★` + (best ? ` · best ${(best.timeMs / 1000).toFixed(2)} s` : '');
        a.append(t, m); li.append(a); return li;
      }));
    } catch (e) { ul.textContent = e.message; }
  </script>
</body>
</html>
