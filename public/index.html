<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playverse</title>
  <meta name="description" content="Tiny browser games and levels. Walk into a portal, race it, beat the leaderboard.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./">Play<span>verse</span></a>
    <div class="title" id="title">Nexus Plaza</div>
    <button class="secondary" id="browse-btn" aria-expanded="false" aria-controls="browse">Browse all</button>
  </header>
  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="Hub: walk into a portal to pick a level"></canvas>
    <div class="hint" id="hint">Walk into a portal · arrow keys / WASD or drag · Enter to play</div>

    <div class="plaque" id="plaque" hidden>
      <div class="card">
        <h2 id="p-title"></h2>
        <p id="p-meta"></p>
        <p id="p-best"></p>
        <p id="p-top"></p>
        <div class="row"><button id="p-enter">Play (Enter)</button></div>
      </div>
    </div>

    <div class="overlay" id="browse" hidden>
      <div class="card wide" role="dialog" aria-labelledby="browse-title">
        <div class="row head">
          <h2 id="browse-title">All levels</h2>
          <button class="secondary" id="browse-close">Close</button>
        </div>
        <input id="search" type="search" placeholder="Search levels" aria-label="Search levels">
        <ul class="levels" id="levels"></ul>
      </div>
    </div>

    <div class="overlay" id="error" hidden>
      <div class="card"><h2>Could not load the hub</h2><p id="error-text"></p></div>
    </div>
  </main>
  <script type="module" src="js/hub.js"></script>
</body>
</html>
