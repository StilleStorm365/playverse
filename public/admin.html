<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Playverse admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="bar"><a class="brand" href="./">Play<span>verse</span></a><div class="title">Admin · community portals</div></header>
  <main class="wrap">
    <form class="login" id="login">
      <input id="token" type="password" placeholder="Admin token (from .env.admin)" aria-label="Admin token" autocomplete="off">
      <button>Open</button>
    </form>
    <p id="live" class="meta" role="status"></p>
    <p class="status" id="status" role="status"></p>
    <div class="table-wrap"><table id="list" hidden>
      <thead><tr><th>Portal</th><th>Kind</th><th>By</th><th>Reports</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
