# Playverse presence: one Durable Object ("nexus") holds the hub's WebSocket connections.
# Not reachable on its own (no workers.dev route); the Pages project binds to it (script_name).
name = "playverse-room"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
